[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harnesshub"
version = "0.2.0"
description = "A terminal control center for subscription AI coding harnesses"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["textual>=0.85", "rich>=13.7", "platformdirs>=4"]

[project.scripts]
harnesshub = "harnesshub.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/harnesshub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

